<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>FocusGuard - Stay Focused</title>

    <link
        rel="stylesheet"
        href="blocked.css"
    >

</head>


<body>

    <main class="page">

        <div class="card">

            <div class="icon">
                🚫
            </div>


            <h1>
                Stay Focused
            </h1>


            <p class="blocked-text">

                <span id="websiteName">
                    This website
                </span>

                is currently blocked.

            </p>


            <p class="label">
                Available again in
            </p>


            <div
                id="countdown"
                class="countdown"
            >
                00:00:00
            </div>


            <p
                id="status"
                class="status"
            >
                Your focus session is active.
            </p>


            <button
                id="backButton"
            >
                Go Back
            </button>

        </div>

    </main>


    <script src="blocked.js"></script>

</body>

</html>
