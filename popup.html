<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FocusGuard</title>
    <link rel="stylesheet" href="popup.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  </head>

  <body>
    <div class="container">
      <!-- Header -->
      <header class="header">
        <div class="header-content">
          <div class="logo-wrapper">
            <div class="logo-icon">🛡️</div>
            <h1 class="logo-text">FocusGuard</h1>
          </div>
          <p class="subtitle">Protect your focus. Boost your productivity.</p>
        </div>
      </header>

      <!-- Add website section -->
      <section class="add-section card-animate">
        <!-- Block Type Dropdown -->
        <div class="form-group">
          <label class="form-label" for="blockType">
            <span class="label-icon">📋</span> Blocking Mode
          </label>
          <select id="blockType" class="form-select">
            <option value="temporary">⏱️ Block by Minutes</option>
            <option value="scheduled">📅 Time-Based Block</option>
          </select>
        </div>

        <!-- Website Input -->
        <div class="form-group">
          <label class="form-label" for="websiteInput">
            <span class="label-icon">🌐</span> Website Domain
          </label>
          <div class="input-wrapper">
            <span class="input-icon">🔗</span>
            <input
              type="text"
              id="websiteInput"
              placeholder="Enter website domain (ex:- youtube.com)"
              autocomplete="off"
              class="form-input"
            />
          </div>
        </div>

        <!-- Temporary Fields (Minutes) -->
        <div id="temporaryFields" class="form-group slide-down">
          <label class="form-label" for="durationInput">
            <span class="label-icon">⏰</span> Block Duration
          </label>
          <div class="input-wrapper">
            <span class="input-icon">⌛</span>
            <input
              type="number"
              id="durationInput"
              placeholder="Enter minutes"
              min="1"
              class="form-input"
            />
            <span class="input-suffix">min</span>
          </div>
        </div>

        <!-- Schedule Fields -->
        <div id="scheduleFields" class="form-group slide-down hidden">
          <label class="form-label">
            <span class="label-icon">📆</span> Select Days
          </label>
          <div class="days-grid">
            <label class="day-chip" data-day="1">
              <input type="checkbox" value="1" class="day-checkbox" />
              <span>Mon</span>
            </label>
            <label class="day-chip" data-day="2">
              <input type="checkbox" value="2" class="day-checkbox" />
              <span>Tue</span>
            </label>
            <label class="day-chip" data-day="3">
              <input type="checkbox" value="3" class="day-checkbox" />
              <span>Wed</span>
            </label>
            <label class="day-chip" data-day="4">
              <input type="checkbox" value="4" class="day-checkbox" />
              <span>Thu</span>
            </label>
            <label class="day-chip" data-day="5">
              <input type="checkbox" value="5" class="day-checkbox" />
              <span>Fri</span>
            </label>
            <label class="day-chip" data-day="6">
              <input type="checkbox" value="6" class="day-checkbox" />
              <span>Sat</span>
            </label>
            <label class="day-chip" data-day="0">
              <input type="checkbox" value="0" class="day-checkbox" />
              <span>Sun</span>
            </label>
          </div>

          <div class="time-inputs">
            <div class="time-group">
              <label class="time-label">🟢 Start</label>
              <input type="time" id="startTime" class="form-input time-input" />
            </div>
            <div class="time-arrow">→</div>
            <div class="time-group">
              <label class="time-label">🔴 End</label>
              <input type="time" id="endTime" class="form-input time-input" />
            </div>
          </div>
        </div>

        <!-- Action Buttons -->
        <div class="button-group">
          <button id="saveButton" class="btn btn-primary btn-animate">
            <span class="btn-icon">✨</span>
            <span class="btn-text">Create Block</span>
          </button>
          <button id="cancelEditButton" class="btn btn-secondary btn-animate hidden">
            <span class="btn-icon">↩️</span>
            <span class="btn-text">Cancel</span>
          </button>
        </div>

        <p id="message" class="message"></p>
      </section>

      <!-- Active Blocks Section -->
      <section class="blocked-section card-animate">
        <div class="section-header">
          <div class="section-title">
            <span class="section-icon">🔒</span>
            <h2>Active Blocks</h2>
          </div>
          <span id="siteCount" class="badge">0</span>
        </div>
        <div id="blockedSites" class="blocked-sites">
          <!-- Sites will be inserted dynamically -->
        </div>
      </section>

      <!-- Scheduled Blocks Section -->
      <section class="blocked-section card-animate">
        <div class="section-header">
          <div class="section-title">
            <span class="section-icon">📅</span>
            <h2>Scheduled Blocks</h2>
          </div>
          <span id="scheduleCount" class="badge">0</span>
        </div>
        <div id="scheduledBlocks" class="blocked-sites">
          <!-- Scheduled blocks appear here -->
        </div>
      </section>

      <!-- Allowed Websites Section (NEW) -->
      <section class="blocked-section card-animate">
        <div class="section-header">
          <div class="section-title">
            <span class="section-icon">✅</span>
            <h2>Allowed Websites</h2>
          </div>
          <span id="allowedCount" class="badge">0</span>
        </div>
        
        <div class="form-group" style="margin-bottom: 10px;">
          <div class="input-wrapper">
            <span class="input-icon">🔗</span>
            <input
              type="text"
              id="allowedInput"
              placeholder="Add allowed website (e.g., github.com)"
              class="form-input"
              style="padding-left: 38px;"
            />
          </div>
          <button id="addAllowedButton" class="btn btn-primary" style="margin-top: 8px; padding: 8px; font-size: 12px;">
            <span class="btn-icon">➕</span>
            <span class="btn-text">Add to Allowed List</span>
          </button>
        </div>

        <div id="allowedWebsites" class="blocked-sites">
          <!-- Allowed websites will be inserted dynamically -->
        </div>
      </section>
    </div>

    <script src="utils/domain.js"></script>
    <script src="utils/schedule.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
