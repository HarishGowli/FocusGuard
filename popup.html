<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>FocusGuard</title>

    <link rel="stylesheet" href="popup.css" />
  </head>

  <body>
    <div class="container">
      <header>
        <h1>FocusGuard</h1>

        <p class="subtitle">Protect your focus.</p>
      </header>

      <!--
            Add website section
        -->

      <section class="add-section">
        <input
          type="text"
          id="websiteInput"
          placeholder="youtube.com"
          autocomplete="off"
        />

        <select id="blockType">
          <option value="temporary">Block for duration</option>

          <option value="scheduled">Scheduled block</option>
        </select>

        <div id="temporaryFields">
          <input
            type="number"
            id="durationInput"
            placeholder="Minutes"
            min="1"
          />
        </div>

        <div id="scheduleFields" class="hidden">
          <p class="field-label">Select days</p>

          <div class="days">
            <label>
              <input type="checkbox" value="1" class="day-checkbox" />
              Mon
            </label>

            <label>
              <input type="checkbox" value="2" class="day-checkbox" />
              Tue
            </label>

            <label>
              <input type="checkbox" value="3" class="day-checkbox" />
              Wed
            </label>

            <label>
              <input type="checkbox" value="4" class="day-checkbox" />
              Thu
            </label>

            <label>
              <input type="checkbox" value="5" class="day-checkbox" />
              Fri
            </label>

            <label>
              <input type="checkbox" value="6" class="day-checkbox" />
              Sat
            </label>

            <label>
              <input type="checkbox" value="0" class="day-checkbox" />
              Sun
            </label>
          </div>

          <label class="field-label"> Start time </label>

          <input type="time" id="startTime" />

          <label class="field-label"> End time </label>

          <input type="time" id="endTime" />
        </div>

        <button id="saveButton">Create Block</button>

        <p id="message" class="message"></p>
      </section>

      <!--
            Active blocked websites
        -->

      <section class="blocked-section">
        <div class="section-header">
          <h2>Active Blocks</h2>

          <span id="siteCount"> 0 </span>
        </div>

        <div id="blockedSites" class="blocked-sites">
          <!--
                    Sites will be inserted
                    dynamically using JavaScript.
                -->
        </div>
      </section>
    </div>

    <script src="utils/domain.js"></script>
    <script src="utils/schedule.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
